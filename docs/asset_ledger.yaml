# Machine-checkable asset license ledger.
#
# Every committed bundled binary asset (PDF, font, image) MUST have an entry
# here, or `python scripts/check_asset_ledger.py --check` fails (a CI gate).
# Human-readable context lives in docs/DATA_AND_LICENSES.md; this file is the
# enforced source of truth for coverage.
#
# Fields:
#   id             short unique key
#   path           repo-relative path or glob (matched against `git ls-files`)
#   kind           sample_pdf | demo_fixture_pdf | doc_image | figure_image
#                  | slides_pdf | dataset | model
#   license        SPDX id, a named license, or UNKNOWN
#   source         where it came from (generator, hub id, or "unrecorded")
#   redistribution ok | demo_only | unresolved
#   committed      true (default) = a tracked file must match `path`;
#                  false = documentation-only (runtime download, not in git)
#   note           free text
#
# The only committed images are the generated talk charts (docs/talk/figures/*.svg);
# the only committed PDFs are the talk slides (docs/talk/slides/*.pdf).
# Any other bundled PDF, font or image needs an entry with a known license.
version: 1

assets:
  # --- runtime-only (documented, NOT committed) ------------------------------
  - id: korquad_v1
    path: "(runtime download: KorQuAD/squad_kor_v1)"
    kind: dataset
    license: CC BY-ND 2.0 KR
    source: Hugging Face Hub (fetched at run time by quantization/data_korquad.py)
    redistribution: demo_only
    committed: false
    note: >-
      Never copied into the repo. NoDerivatives clause -> redistribution of
      fine-tuned artifacts is a known-unknown (see docs/DATA_AND_LICENSES.md).

  - id: kormedmcqa
    path: "(runtime download: sean0042/KorMedMCQA)"
    kind: dataset
    license: CC BY-NC 2.0
    source: Hugging Face Hub (fetched at run time by quantization/kormedmcqa.py)
    redistribution: demo_only
    committed: false
    note: >-
      Never copied into the repo, except one training item quoted with attribution in
      docs/talk/00_setup.md to show the format; eval JSON keeps ids and option numbers only.
      Weights fine-tuned on it are published non-commercial with attribution.

  - id: midm_base
    path: "(runtime download: K-intelligence/Midm-2.0-Base-Instruct)"
    kind: model
    license: MIT
    source: Hugging Face Hub (fetched at run time)
    redistribution: ok
    committed: false
    note: MIT notice (Copyright (c) 2025 KT Corporation) ships with published derived weights.

  - id: base_models
    path: "(runtime download: Qwen3-8B / Qwen2.5-7B / Yi-1.5-9B / Llama-3.1-8B)"
    kind: model
    license: Apache-2.0 (Qwen/Yi); Llama-3.1 Community (gated, optional)
    source: Hugging Face Hub (fetched at run time)
    redistribution: ok
    committed: false
    note: >-
      Fine-tuned artifacts under quantization/artifacts/ are gitignored (weights
      are regenerable and never committed).

  # --- committed generated figures ----------------------------------------------
  - id: talk_figures
    path: "docs/talk/figures/*.svg"
    kind: figure_image
    license: MIT
    source: generated by scripts/make_figures.py from quantization/results/kormedmcqa_midm/*.json
    redistribution: ok
    committed: true
    note: >-
      Charts for the talk docs. Regenerated, never hand-edited;
      `python scripts/make_figures.py --check` (CI) fails if one drifts from the JSONs.

  # --- committed talk slides ----------------------------------------------------
  - id: talk_slides_pdf
    path: "docs/talk/slides/*.pdf"
    kind: slides_pdf
    license: MIT (slide text and charts); slide 4 quotes one KorMedMCQA item (CC BY-NC 2.0) with attribution
    source: >-
      exported with PowerPoint. _ko.pdf: the deck presented on 2026-11-21 (scripts/make_slides.py
      --high-contrast, then edited by hand before the talk). _en.pdf: scripts/make_slides.py --lang en
      --high-contrast (translation through scripts/slides_en.json).
    redistribution: ok
    committed: true
    note: >-
      A snapshot of what was presented. The numbers inside are not checked by CI;
      the docs under docs/talk/ and docs/EVIDENCE.md are the checked source.
