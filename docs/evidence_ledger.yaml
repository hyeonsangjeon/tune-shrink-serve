# Claim ledger (P0-11) — every strong quantitative/support claim in the READMEs,
# linked to the exact command + raw artifact that proves it. `build_evidence_index.py
# --check` fails CI if a number here diverges from its source JSON, if the value is
# missing from the referenced README, or if a `planned` feature carries a measured
# number. `--emit` regenerates docs/EVIDENCE.md from this file.
#
# status ∈ {ci_verified, recorded_hardware_run, recorded_api_run, historical_not_reproduced, planned}
# Paths are relative to the repository root.
# `expected` is written exactly as it appears in the README; the checker parses it as
# a float for the JSON comparison (rounded to the README's decimal places) AND asserts
# the literal string is present in `readme`. String `expected` uses substring matching.

meta:
  repo: tune-shrink-serve
  note: >-
    Numbers below are auto-verified against committed raw JSON. The talk run
    (Mi:dm 2.0 Base x KorMedMCQA) is under quantization/results/kormedmcqa_midm/:
    one H100 NVL, seed 42, plus one managed-API run per model on Azure AI Foundry.
    The earlier Qwen3-8B x KorQuAD run (A100, Spot) is under archive/qwen3_korquad/results/.
    Each run was recorded once and is reproducible from its config; GPU runs are not
    re-executed in CI.

claims:
  # ---- Derived tables (credential-free, CI-verified) -----------------------
  - id: bench_tables_reproduce
    capability: "Derived benchmark tables reproduce from raw JSON (no hand-edited numbers)"
    status: ci_verified
    command: "python -m quantization.v2_report --check-historical"
    source: archive/qwen3_korquad/results/vllm_throughput.json
    note: >-
      three_way_table.json (EM/F1/ppl mean±std) and vllm_throughput.json (sweep +
      crossover/ratios + clean VRAM) are regenerated from the read-only raw
      results/*.json and hash-compared to the committed files. CI fails on any
      mismatch, so a human can never hand-edit a derived number (spec P1-2).

  # ---- Frozen dev/holdout separation (P1-1) --------------------------------
  - id: split_disjoint
    capability: "selection_dev vs final_holdout are disjoint (no selection leakage)"
    status: ci_verified
    command: "python -m quantization.splits --check"
    source: archive/qwen3_korquad/results/split_manifest.json
    pointer: /intersection_size
    expected: "0"
    readme: archive/qwen3_korquad/README.md

