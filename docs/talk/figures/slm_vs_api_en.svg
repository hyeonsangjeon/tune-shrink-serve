<svg xmlns="http://www.w3.org/2000/svg" class="r" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="t d">
<title id="t">SLM vs API: accuracy and cost per 1,000 questions on the 3,009 questions, 2022–2024</title><desc id="d">Accuracy (vertical) and computed cost per 1,000 questions (horizontal, log scale) for Mi:dm 2.0 Base LoRA on a self-hosted H100 (BF16, INT4 PTQ) and 11 managed API models on Azure AI Foundry. For self-hosted BF16 a line joins running all at once and a server at concurrency 1 with prefix caching off</desc>
<style>
.r{--bg:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;--grid:#e1e0d9;--base:#c3c2b7;
