<text class="t" x="20" y="30">온라인 서빙: 동시 요청 수별 초당 처리 요청 (H100, 2021년 시험 문항, 답 1~2토큰)</text>
<text class="m" x="20.0" y="52.0" text-anchor="start">실선 prefix caching 켬, 점선 끔. 동시 요청 수마다 새 256문항을 보냈고, 켬과 끔에 같은 문항을 보냈습니다.</text>
